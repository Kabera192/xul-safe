server.port=8080
spring.application.name=login-app
server.error.whitelabel.enabled=false

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PWD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER}
app.jwt.expiry-seconds=86400

# File upload size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Admin seeder is disabled — use the one-time setup endpoint instead:
# POST /api/v1/admin/setup with { setupKey, email, password, firstName, lastName, phoneNumber }
# Set the ADMIN_SETUP_KEY environment variable before starting the server, then unset it after the admin is created.
admin.seed.enabled=false
admin.setup.key=${ADMIN_SETUP_KEY:}

springdotenv.exportToSystemProperties=true