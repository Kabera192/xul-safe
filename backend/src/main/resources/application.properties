server.port=8080
spring.application.name=login-app
server.error.whitelabel.enabled=false

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PWD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER}
app.jwt.expiry-seconds=86400

# File upload size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# SMS/WhatsApp (currently unused by the OTP flows below, kept for any future
# phone-based notification need). Tries CallMeBot (free WhatsApp relay, single
# test number) first, then Twilio WhatsApp, then Twilio SMS, then Textbelt,
# then falls back to printing to the console (dev mode).
callmebot.apikey=${CALLMEBOT_APIKEY:}
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}
twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:}
textbelt.key=${TEXTBELT_KEY:}

# Email OTP (password reset + account verification). Leave MAIL_USERNAME
# unset in .env to keep using the EMAIL-DEV console fallback.
# Defaults to port 465 (implicit SSL) since some networks block 587
# (STARTTLS submission) outright. Override MAIL_PORT/MAIL_SSL/MAIL_STARTTLS
# in .env if a provider needs 587+STARTTLS instead (e.g. some business
# email hosts).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
mail.from=${MAIL_FROM:}

# Admin seeder is disabled — use the one-time setup endpoint instead:
# POST /api/v1/admin/setup with { setupKey, email, password, firstName, lastName, phoneNumber }
# Set the ADMIN_SETUP_KEY environment variable before starting the server, then unset it after the admin is created.
admin.seed.enabled=false
admin.setup.key=${ADMIN_SETUP_KEY:}

springdotenv.exportToSystemProperties=true