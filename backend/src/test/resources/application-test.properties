app.jwt.secret=test-secret-key-for-login-bus-tests-1234567890
app.jwt.issuer=login-bus-test

# In-memory database for tests -- @SpringBootTest boots the ApplicationContext
# directly and never runs main()'s Dotenv-based DB_URL loading, so without this
# spring.datasource.url stays the literal unresolved "${DB_URL}" placeholder
# from application.properties and context-loading tests fail before even
# reaching a real database.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop