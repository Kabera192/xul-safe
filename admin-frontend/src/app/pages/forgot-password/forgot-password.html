<div class="forgot-container">
  <!-- Left Panel - Logo Section -->
  <div class="forgot-left">
    <img src="logo.png" alt="XulSafe Logo" class="logo" />
  </div>

  <!-- Right Panel - Form Section -->
  <div class="forgot-right">
    <div class="forgot-form-container">
      <h1>Forgot password</h1>
      <p class="subtitle">Enter your registered phone number to receive a verification code.</p>

      @if (error) {
        <div class="form-error">{{ error }}</div>
      }

      <form class="forgot-form" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <input
            type="tel"
            id="phoneNumber"
            [(ngModel)]="phoneNumber"
            name="phoneNumber"
            placeholder="Phone number (e.g. +1234567890)"
            required
          />
        </div>

        <button type="submit" class="btn-send" [disabled]="loading">
          {{ loading ? 'Sending…' : 'Send code' }}
        </button>
      </form>

      <div class="back-to-login">
        Back to <a routerLink="/login">Sign in</a>
      </div>
    </div>
  </div>
</div>
