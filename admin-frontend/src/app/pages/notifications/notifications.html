<div class="notifications-page">

  <!-- Header -->
  <div class="page-card header-card">
    <div class="header-left">
      <h1>Notifications &amp; Alerts</h1>
      <span class="total-badge">{{ notificationRows.length }} total</span>
      <span class="total-badge" *ngIf="unreadCount > 0">{{ unreadCount }} unread</span>
    </div>
    <div class="header-actions">
      <button class="mark-all-btn" type="button" *ngIf="unreadCount > 0" (click)="markAllRead()">
        Mark all as read
      </button>
      <button class="btn-refresh" type="button" (click)="load()" [disabled]="isLoading">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        Refresh
      </button>
    </div>
  </div>

  <!-- Error -->
  <div class="notification error" *ngIf="errorMessage">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="15" y1="9" x2="9" y2="15"></line>
      <line x1="9" y1="9" x2="15" y2="15"></line>
    </svg>
    {{ errorMessage }}
  </div>

  <!-- Search -->
  <div class="page-card search-card">
    <input
      type="text"
      placeholder="Search notifications..."
      [(ngModel)]="searchTerm"
    />
  </div>

  <!-- List -->
  <div class="page-card list-card">
    <div class="empty-state" *ngIf="isLoading">Loading notifications...</div>

    <div class="empty-state" *ngIf="!isLoading && filteredRows.length === 0">
      No notifications found.
    </div>

    <div
      class="notification-row"
      *ngFor="let row of filteredRows"
      (click)="markRead(row)"
    >
      <div class="avatar">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </div>
      <div class="row-content">
        <span class="notification-row-title">{{ row.title }}</span>
        <p class="notification-row-message">{{ row.message }}</p>
      </div>
      <div class="row-meta">
        <span class="notification-row-time">{{ row.time }}</span>
        <span class="unread-dot" *ngIf="!row.isRead"></span>
      </div>
    </div>
  </div>
</div>
