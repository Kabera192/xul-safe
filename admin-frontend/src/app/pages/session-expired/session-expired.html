<div class="session-expired-container">
  <div class="session-expired-left">
    <img src="logo.png" alt="XulSafe Logo" class="logo" />
  </div>

  <div class="session-expired-right">
    <div class="session-expired-card">
      <div class="icon-circle">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>

      <h1>Session expired</h1>
      <p class="subtitle">Your session has timed out for your security. Please log in again to continue.</p>

      <button type="button" class="btn-return" (click)="returnToLogin()">
        Return to Login
      </button>
    </div>
  </div>
</div>
